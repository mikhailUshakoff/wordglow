name: release-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Release description = this tag's section of CHANGELOG.md (tag v0.0.3
      # -> "## [0.0.3]"). A tag push with no matching section fails here,
      # before any toolchain install or build; a manual run without a tag uses a placeholder.
      - name: release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! body="$(bash scripts/changelog-section.sh "$version")"; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "::error file=CHANGELOG.md::add a '## [$version]' section before tagging $GITHUB_REF_NAME"
              exit 1
            fi
            body="Manual build from ${GITHUB_REF_NAME} (no CHANGELOG.md section)."
          fi
          {
            echo "body<<__CHANGELOG_EOF__"
            echo "$body"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: install tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: wordglow
          tagName: ${{ github.ref_name }}
          releaseName: "Wordglow ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
